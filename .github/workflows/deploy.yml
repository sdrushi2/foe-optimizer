name: Build e Deploy su GitHub Pages

# Si attiva automaticamente ad ogni push sul branch main.
# "workflow_dispatch" permette anche di lanciarla a mano dalla tab Actions
# di GitHub, utile per ri-pubblicare senza dover fare un commit vuoto.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permessi minimi necessari per pubblicare su GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta. Come raccomanda GitHub per Pages, quello in
# corso NON viene annullato (interromperlo a metà della pubblicazione può
# lasciare il deploy in uno stato incoerente): un push arrivato nel frattempo
# aspetta, e se ne arrivano più d'uno parte solo l'ultimo (quelli intermedi,
# ormai superati, vengono saltati).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      # Vite/esbuild non tipizzano in fase di build: senza questo step, un
      # errore TypeScript non verrebbe rilevato qui e finirebbe comunque in
      # produzione. tsconfig.json ha già noEmit+strict, quindi "npm run
      # typecheck" (tsc --noEmit) è il vero gate di correttezza dei tipi.
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (eslint src)
        run: npm run lint

      - name: Build (npm run build)
        run: npm run build

      - name: Prepara l'artifact per Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Dalla v4 i file/cartelle nascosti sono esclusi dall'artifact:
          # senza questo, dist/.well-known/ non verrebbe pubblicata.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

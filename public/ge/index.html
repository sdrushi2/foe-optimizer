<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatore dei Grandi Edifici – FoE Optimizer</title>
    <meta name="description" content="Calcolatore dei Grandi Edifici di Forge of Empires: PF del livello, ricompense di ogni posto con la percentuale della chat (20, 100 ecc.) e quanti PF servono per coprirlo.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="canonical" href="https://foe-optimizer.com/ge/">
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --bg-deep: #020617;
        --panel: #1e293b;
        --panel-2: #172033;
        --border: #334155;
        --text: #e2e8f0;
        --text-dim: #94a3b8;
        --text-faint: #64748b;
        --amber: #fbbf24;
        --amber-dim: #d97706;
        --green: #34d399;
        --red: #f87171;
        --copper: #e0915a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at 50% -10%, var(--panel) 0%, var(--bg) 45%, var(--bg-deep) 100%);
        background-attachment: fixed;
        color: var(--text);
        line-height: 1.5;
      }
      .wrap { max-width: 640px; margin: 0 auto; padding: 10px 10px 24px; }

      /* header come quello dell'editor (public/editor.html) e della testata del tool */
      #bar {
        position: sticky; top: 0; z-index: 10;
        display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px;
        padding: 6px 10px;
        background: rgba(15, 23, 42, .6);
        -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
        border-bottom: 1px solid rgba(245, 158, 11, .1);
      }
      .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; text-decoration: none; }
      .logo {
        display: flex; align-items: center; justify-content: center;
        width: 28px; height: 28px; flex-shrink: 0;
        border-radius: 11px; border: 1.5px solid rgba(245, 158, 11, .8);
        background: rgba(2, 6, 23, .8); color: #fbbf24;
        box-shadow: 0 0 12px rgba(245, 158, 11, .15);
      }
      .brand h1 {
        margin: 0; font-size: 20px; line-height: 1; font-weight: 900;
        text-transform: uppercase; letter-spacing: .025em; white-space: nowrap;
        background: linear-gradient(to right, #fcd34d, #fbbf24, #f59e0b);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .btn {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 7px 14px; border-radius: 9px;
        background: #1e293b; color: #cbd5e1; border: 1px solid #334155;
        font-weight: 700; font-size: 12px; text-decoration: none;
      }
      .btn:hover { background: #334155; }
      .card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px; margin-bottom: 8px; }
      select, input { font: inherit; font-size: .9rem; color: var(--text); background: var(--bg-deep); border: 1px solid var(--border); border-radius: 7px; padding: 6px 8px; }
      select:focus, input:focus { outline: none; border-color: var(--amber-dim); }
      button { font: inherit; font-weight: 700; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px; cursor: pointer; }
      button:hover { border-color: var(--amber-dim); color: var(--amber); }
      /* riga 1: GE + livello */
      .riga { display: flex; gap: 6px; align-items: center; }
      .riga select { flex: 1; min-width: 0; }
      .liv { display: flex; gap: 4px; align-items: center; }
      .liv input { width: 56px; text-align: center; padding: 6px 4px; }
      .liv button { padding: 6px 9px; }
      /* riga 2: chat (3 Rame / Oro + Custom) */
      .chat { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 6px; }
      .chat button { grid-column: span 2; font-size: .72rem; padding: 6px 2px; white-space: nowrap; }
      .chat button.oro { grid-column: span 3; }
      .chat .custom { grid-column: span 3; display: flex; gap: 4px; align-items: center; }
      .chat .custom button { flex: 1; }
      .chat .custom input { width: 52px; text-align: center; padding: 5px 4px; font-size: .8rem; }
      .chat .custom span { font-size: .8rem; color: var(--text-dim); }
      .chat button.attivo { border-color: var(--amber); color: var(--bg-deep); background: var(--amber); }
      .chat button.oro { color: var(--amber); }
      .chat button.oro.attivo { color: var(--bg-deep); background: var(--amber); border-color: var(--amber); }
      .chat button.rame { color: var(--copper); } .chat button.rame.attivo { color: var(--bg-deep); background: var(--copper); border-color: var(--copper); }
      .chat button:disabled { opacity: .35; cursor: not-allowed; border-color: var(--border); }

      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
      .stat { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 6px 8px; }
      .stat .k { font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); line-height: 1.2; }
      .stat .v { font-family: ui-monospace, Consolas, monospace; font-size: 1.05rem; font-weight: 700; margin-top: 2px; }

      .card.tabella { padding: 4px 8px; }
      table { width: 100%; border-collapse: collapse; font-family: ui-monospace, Consolas, monospace; font-size: .85rem; }
      th { font-family: inherit; font-size: .58rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; line-height: 1.2; color: var(--text-dim); padding: 5px 4px; text-align: right; border-bottom: 1px solid var(--border); }
      th:first-child, td:first-child { text-align: left; }
      td { padding: 4px; text-align: right; border-bottom: 1px solid rgba(51, 65, 85, .5); }
      tr:last-child td { border-bottom: 0; }
      td.pos { font-weight: 800; font-size: 1.05rem; color: var(--amber); }
      tr.vuoto td { color: var(--text-faint); }
      tr.vuoto td.pos { color: var(--text-faint); }
      .sicuro { color: var(--green); font-weight: 700; }
      .pieno { color: var(--red); }
      footer { color: var(--text-faint); font-size: .7rem; margin-top: 12px; text-align: center; }
      footer p { margin: 0; }
      #errore { color: var(--red); margin: 4px 0 8px; }

      @media (max-width: 420px) {
        .brand h1 { font-size: 17px; }
        .btn { padding: 6px 10px; }
      }
    </style>
  </head>
  <body>
    <header id="bar">
      <a class="brand" href="/" title="FoE Optimizer">
        <div class="logo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m13 19 6-6"/>
            <path d="M14.5 17.5 3.586 6.586A2 2 0 013 5.172V3h2.172a2 2 0 011.414.586L17.5 14.5"/>
            <path d="m14.828 6.172 2.586-2.586A2 2 0 0118.828 3H21v2.172a2 2 0 01-.586 1.414l-2.586 2.586"/>
            <path d="m16 16 4 4"/><path d="m19 21 2-2"/><path d="m5 14 4 4"/><path d="m5 21-2-2"/><path d="M7.5 16.5 4 20"/>
          </svg>
        </div>
        <h1>Calcolatore GE</h1>
      </a>
      <a class="btn" href="/">← Torna al tool</a>
    </header>

    <div class="wrap">
      <p id="errore" hidden></p>

      <div class="card">
        <div class="riga">
          <select id="ge" aria-label="Grande Edificio"></select>
          <div class="liv" title="Livello in costruzione">
            <button type="button" id="meno" aria-label="Livello precedente">−</button>
            <input id="livello" type="number" min="1" inputmode="numeric" aria-label="Livello in costruzione">
            <button type="button" id="piu" aria-label="Livello successivo">+</button>
          </div>
        </div>
        <div class="chat" id="chat">
          <button type="button" class="rame" data-chat="r90" title="CHAT RAME 90%">RAME 90%</button>
          <button type="button" class="rame" data-chat="r95" title="CHAT RAME 95%">RAME 95%</button>
          <button type="button" class="rame" data-chat="r100" title="CHAT RAME 100%">RAME 100%</button>
          <button type="button" class="oro" data-chat="o20" title="CHAT ORO 20%">ORO 20%</button>
          <span class="custom">
            <button type="button" data-chat="custom">CUSTOM</button>
            <input id="custom" inputmode="decimal" aria-label="Percentuale personalizzata" placeholder="%"><span>%</span>
          </span>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><div class="k">PF del livello</div><div class="v" id="totale"></div></div>
        <div class="stat" title="PF che restano a carico del proprietario per completare il livello"><div class="k">PF proprietario</div><div class="v" id="proprietario"></div></div>
        <div class="stat" title="PF versati in tutto dai mecenati dei posti (con la percentuale della chat)"><div class="k">PF contribuzioni</div><div class="v" id="contribuzioni"></div></div>
      </div>

      <div class="card tabella">
        <table>
          <thead>
            <tr>
              <th>Pos.</th>
              <th title="Ricompensa del posto in PF, senza bonus dell'Arca">Ricompensa</th>
              <th title="PF che il mecenate versa per riavere esattamente la ricompensa con la sua percentuale">Da versare</th>
              <th title="PF tuoi in più per assicurare questo posto, oltre ai precedenti">Per coprire</th>
              <th title="PF del proprietario in totale per assicurare questo posto (e tutti quelli sopra)">Totale per coprire</th>
            </tr>
          </thead>
          <tbody id="righe"></tbody>
        </table>
      </div>

      <footer>
        <p>Forge of Empires è un marchio di InnoGames GmbH. FoE Optimizer è un progetto amatoriale indipendente, non affiliato a InnoGames.</p>
      </footer>
    </div>

    <!-- costi, nomi e tier dei GE (RECUPERO DATI/gecosti.py): script e non JSON, così
         la pagina funziona anche aperta dal disco (file://), dove fetch() non va -->
    <script src="../data/mecenati-dati.js"></script>
    <script>
      (function () {
        // Quota dei mecenati sul costo del livello: [ultimo livello della fascia, quota]
        const FASCE = [[9, .25], [39, .30], [69, .40], [100, .25], [200, .15], [300, .10], [400, .07], [500, .05]];
        // Divisione dei premi fra i posti (Rame 5 posti, Oro 7 posti)
        const QUOTE = { 5: [120, 60, 20, 5, 1].map(x => x / 206), 7: [5040, 2520, 840, 210, 42, 7, 1].map(x => x / 8660) };
        const CHIAVE = "foe-optimizer-calcolatore-ge";
        const CHAT = { r90: 90, r95: 95, r100: 100, o20: 20 };
        const $ = id => document.getElementById(id);
        const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "."); // (sempre il punto, anche a 4 cifre)
        const numero = (v, d = 0) => { const x = parseFloat(String(v).replace(",", ".")); return isFinite(x) && x >= 0 ? x : d; };

        const dati = window.MECENATI && window.MECENATI.edifici;
        if (!dati) { $("errore").hidden = false; $("errore").textContent = "Non riesco a caricare i dati dei Grandi Edifici (data/mecenati-dati.js). Ricarica la pagina."; return; }
        avvia(dati);

        function avvia(dati) {
          const costi = {};
          for (const id in dati) costi[id] = dati[id].costi;
          const ids = Object.keys(costi);
          const nome = id => dati[id].nome || id;
          const oro = id => !!dati[id].oro;
          // chat scelta per tier (livelli Rame 5 posti, livelli Oro 7), validata in calcola()
          const S = { ge: "X_FutureEra_Landmark1", livello: 1, custom: "80", chat: { rame: "r90", oro: "o20" } };
          try { Object.assign(S, JSON.parse(localStorage.getItem(CHIAVE) || "{}")); } catch (e) { /* niente */ }
          if (!costi[S.ge]) S.ge = ids[0];
          if (!S.chat || typeof S.chat !== "object") S.chat = {}; // (salvataggio vecchio o rovinato)
          const salva = () => { try { localStorage.setItem(CHIAVE, JSON.stringify(S)); } catch (e) { /* niente */ } };
          const maxLiv = () => costi[S.ge].length;
          const livOk = v => Math.min(maxLiv(), Math.max(1, parseInt(v) || 1));

          ids.sort((a, b) => nome(a).localeCompare(nome(b), "it"));
          for (const id of ids) $("ge").add(new Option(nome(id), id));

          function calcola() {
            const lvl = livOk(S.livello), costo = costi[S.ge][lvl - 1];
            const quota = (FASCE.find(f => lvl <= f[0]) || FASCE[FASCE.length - 1])[1];
            const n = oro(S.ge) && lvl >= 101 ? 7 : 5, tier = n === 7 ? "oro" : "rame";
            // % della chat scelta per questo tier (la stessa per tutti i posti; fattore = 1 + % / 100)
            const valida = tier === "oro" ? ["o20", "custom"] : ["r90", "r95", "r100", "custom"];
            if (!valida.includes(S.chat[tier])) S.chat[tier] = tier === "oro" ? "o20" : "r90";
            const perc = S.chat[tier] === "custom" ? numero(S.custom, 0) : CHAT[S.chat[tier]];
            // (montepremi NON arrotondato prima della divisione: così fa il gioco, come
            // mostra FoE Helper; Linnun lo arrotonda e sbaglia di 1 PF qua e là, es.
            // Osservatorio 156: posto 2 = 3.801 e non 3.802)
            const premi = costo * quota;
            let somma = 0, prec = 0;
            const righe = [];
            for (let i = 0; i < n; i++) {
              const base = Math.round(premi * QUOTE[n][i]);
              const versa = Math.max(0, Math.round(base * (1 + perc / 100)));
              somma += versa;
              // sicuro quando quello che resta (costo - posti 1..i - i tuoi) non supera questo posto
              const serve = Math.max(0, costo - somma - versa);
              const tuoi = Math.max(prec, serve);
              const assicura = tuoi - prec;
              const pieno = tuoi + somma > costo;
              righe.push({ base, versa, assicura, tuoi, pieno });
              prec = tuoi;
            }
            // contribuzioni dei posti (mai oltre il costo del livello) e resto al proprietario
            const contribuzioni = Math.min(costo, somma);
            return { costo, n, tier, righe, contribuzioni, proprietario: costo - contribuzioni };
          }

          // righe della tabella (7, le ultime 2 nascoste nel tier Rame)
          const corpo = $("righe");
          for (let i = 0; i < 7; i++) {
            const tr = document.createElement("tr");
            tr.innerHTML = '<td class="pos">' + (i + 1) + '</td><td class="b"></td><td class="c"></td><td class="a"></td><td class="t"></td>';
            corpo.append(tr);
          }

          function mostra() {
            const r = calcola();
            // chat Rame solo per i livelli Rame, chat Oro solo per quelli Oro (CUSTOM sempre)
            document.querySelectorAll("#chat button").forEach(b => {
              b.disabled = r.tier === "oro" ? b.classList.contains("rame") : b.classList.contains("oro");
              const attivo = b.dataset.chat === S.chat[r.tier];
              b.classList.toggle("attivo", attivo);
              b.setAttribute("aria-pressed", String(attivo));
            });
            $("totale").textContent = fmt(r.costo);
            $("contribuzioni").textContent = fmt(r.contribuzioni);
            $("proprietario").textContent = fmt(r.proprietario);
            [...corpo.children].forEach((tr, i) => {
              tr.hidden = i >= r.n;
              if (i >= r.n) return;
              const o = r.righe[i];
              tr.className = o.base > 0 ? "" : "vuoto";
              tr.querySelector(".b").textContent = fmt(o.base);
              tr.querySelector(".c").textContent = fmt(o.versa);
              const a = tr.querySelector(".a"), t = tr.querySelector(".t");
              a.className = "a";
              if (o.pieno) { a.innerHTML = t.innerHTML = '<span class="pieno">pieno</span>'; }
              else {
                if (o.assicura) a.textContent = fmt(o.assicura); else { a.textContent = "sicuro"; a.classList.add("sicuro"); }
                t.textContent = fmt(o.tuoi);
              }
            });
            salva();
          }

          const sincronizza = () => { S.livello = livOk(S.livello); $("livello").value = S.livello; $("livello").max = maxLiv(); };
          $("ge").addEventListener("change", e => { S.ge = e.target.value; sincronizza(); mostra(); });
          $("livello").addEventListener("input", e => { S.livello = e.target.value; mostra(); });
          $("livello").addEventListener("change", () => { sincronizza(); mostra(); });
          $("meno").addEventListener("click", () => { S.livello = livOk(S.livello) - 1; sincronizza(); mostra(); });
          $("piu").addEventListener("click", () => { S.livello = livOk(S.livello) + 1; sincronizza(); mostra(); });
          // chat: la stessa % in tutti i posti, per il tier del livello mostrato
          const applicaChat = chat => {
            S.chat[calcola().tier] = chat;
            mostra();
          };
          document.querySelectorAll("#chat button").forEach(b => b.addEventListener("click", () => applicaChat(b.dataset.chat)));
          $("custom").addEventListener("input", e => { S.custom = e.target.value; applicaChat("custom"); });

          $("ge").value = S.ge;
          $("custom").value = S.custom || "";
          sincronizza();
          mostra();
        }
      })();
    </script>
  </body>
</html>

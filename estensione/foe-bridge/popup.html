<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; --bg:#0f172a; --card:#151e30; --border:#263043; --text:#e2e8f0; --dim:#8391a7; --faint:#64748b;
          --green:#34d399; --green-bg:#0f3b2f; --green-line:#2f6f5a; --amber:#fbbf24; --amber-bg:#3a2c0c; --red:#f87171; --red-bg:#3b1717; }
  body { margin:0; width:340px; background:var(--bg); color:var(--text); font:12px/1.35 system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid var(--border); }
  header img { width:20px; height:20px; }
  header .name { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header b { font-size:13px; font-weight:600; }
  .ver { color:var(--faint); font-size:10px; margin-left:4px; }
  #lang { display:inline-flex; flex:none; border:1px solid #334155; border-radius:5px; overflow:hidden; }
  #lang button { background:none; border:none; padding:2px 7px; font:600 10px system-ui, sans-serif; letter-spacing:.04em; color:var(--dim); cursor:pointer; }
  #lang button[aria-pressed="true"] { background:#334155; color:var(--text); }
  #lang button:hover { color:var(--text); }
  #lang button:focus-visible { outline:2px solid var(--amber); outline-offset:-2px; }
  #worlds { padding:8px; display:flex; flex-direction:column; gap:6px; }
  .world { background:var(--card); border:1px solid var(--border); border-radius:7px; }
  .world.live { border-color:var(--green-line); }
  .card { position:relative; display:flex; align-items:center; gap:10px; width:100%; box-sizing:border-box; padding:7px 9px;
          color:inherit; border-radius:7px; cursor:pointer; font:inherit; text-align:left; }
  .card:hover { background:#18233a; }
  .card:focus-visible { outline:2px solid var(--amber); outline-offset:-2px; }
  .tile { width:24px; height:24px; border-radius:5px; flex:none; display:flex; align-items:center; justify-content:center;
          font-weight:600; font-size:12px; background:#1e293b; color:#94a3b8; }
  .live .tile { background:var(--green-bg); color:#6ee7b7; }
  .wait .tile { background:var(--amber-bg); color:var(--amber); }
  .no .tile { background:var(--red-bg); color:var(--red); }
  .info { flex:1; min-width:0; }
  .l1, .l2 { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .l1 { font-weight:600; }
  .l1 .srv { color:var(--dim); font-weight:400; }
  .l2 { color:var(--dim); font-size:11px; }
  .wait .l2 { color:var(--amber); } .no .l2 { color:var(--red); }
  /* LIVE / PAUSED: pause of the whole world (the switches stay) */
  .pill { flex:none; padding:2px 7px; border-radius:999px; border:1px solid var(--green-line); background:var(--green-bg); color:#6ee7b7;
          font:600 10px system-ui, sans-serif; letter-spacing:.05em; cursor:pointer; }
  .pill.paused { border-color:#2b5d80; background:#0c2a3e; color:#7dd3fc; }
  .pill:hover { filter:brightness(1.25); }
  .pill:focus-visible { outline:2px solid var(--amber); outline-offset:1px; }
  .cities { padding:0 9px 7px; border-top:1px solid var(--border); }
  .paused .cities { opacity:.55; }
  .sec { color:var(--faint); font-size:10px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; margin:7px 0 3px; }
  .none { color:var(--faint); font-size:11px; padding:0 0 2px; }
  .city { display:flex; align-items:center; gap:7px; min-height:24px; }
  .face { width:18px; height:18px; flex:none; border-radius:4px; overflow:hidden; background:#1e293b; color:#94a3b8;
          display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:600; }
  .face img { width:100%; height:100%; object-fit:cover; }
  .city .nm { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .now { display:inline-block; width:7px; height:7px; margin-left:5px; border-radius:50%; background:var(--green); box-shadow:0 0 5px rgba(52,211,153,.7); vertical-align:1px; }
  .when { flex:none; color:var(--faint); font-size:10px; }
  .rm { flex:none; width:18px; height:18px; padding:0; border:none; border-radius:4px; background:none; color:var(--faint); font-size:11px; cursor:pointer; visibility:hidden; }
  .city:hover .rm, .rm:focus-visible { visibility:visible; }
  .city:hover .when { display:none; }
  .rm:hover { color:var(--red); }
  .ask .nm { color:var(--text); }
  .ask button { flex:none; border:1px solid var(--border); border-radius:5px; background:none; padding:1px 7px; font:inherit; font-size:11px; cursor:pointer; color:var(--dim); }
  .ask .yes { border-color:#7f2a2a; color:var(--red); }
  .ask button:hover { color:var(--text); }
  /* switch: on = goes to FoE Optimizer */
  .switch { flex:none; position:relative; width:28px; height:16px; padding:0; border-radius:999px; border:1px solid #3b4a63; background:#1e293b; cursor:pointer; }
  .switch .knob { position:absolute; top:2px; left:2px; width:10px; height:10px; border-radius:50%; background:#64748b; transition:left .15s, background .15s; }
  .switch.on { background:var(--green-bg); border-color:var(--green-line); }
  .switch.on .knob { left:14px; background:var(--green); }
  .switch:focus-visible { outline:2px solid var(--amber); outline-offset:1px; }
  .forget { flex:none; width:20px; height:20px; padding:0; border:none; border-radius:5px; background:none; color:var(--faint); font-size:12px; cursor:pointer; opacity:0; }
  .card:hover .forget, .card:focus-within .forget { opacity:1; }
  .forget:hover { color:var(--red); }
  .empty { color:var(--dim); padding:4px 4px 6px; }
  footer { display:flex; justify-content:space-between; align-items:center; padding:7px 12px; border-top:1px solid var(--border); }
  footer button { background:none; border:none; padding:2px 0; font:inherit; cursor:pointer; }
  #tool { color:var(--amber); font-weight:600; }
  #tool:hover { text-decoration:underline; }
  #monitor { color:var(--faint); font-size:11px; }
  #monitor:hover { color:var(--text); }
</style>
</head>
<body>
<header><img src="icons/icon-32.png" alt=""><span class="name"><b>FoE Optimizer Bridge</b><span class="ver" id="version"></span></span>
  <span id="lang" role="group"><button type="button" data-lang="it" aria-pressed="true">IT</button><button type="button" data-lang="en" aria-pressed="false">EN</button></span></header>
<div id="worlds"></div>
<footer><button id="tool">Apri FoE Optimizer ↗</button><button id="monitor">Monitor</button></footer>
<script src="popup.js"></script>
</body>
</html>
